name: Weekly backtest + self-tuning

on:
  schedule:
    # 03:30 UTC Saturday = 9:00am IST Saturday (market closed).
    - cron: "30 3 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Walk-forward backtest (writes params.json + backtest_report.md)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ vars.CAPITAL }}
        run: python3 backtest.py --years 6

      - name: Save results back to the repo
        run: |
          git config user.name "nse-swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add params.json backtest_report.md backtest_trades.csv
          git diff --cached --quiet || git commit -m "Weekly backtest [bot]"
          git pull --rebase --autostash && git push
