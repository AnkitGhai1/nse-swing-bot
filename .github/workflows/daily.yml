name: End-of-day screener

on:
  schedule:
    # 10:50 UTC = 4:20pm IST, Mon-Fri (NSE closes 3:30pm IST).
    # GitHub has no NSE holiday calendar; on a holiday the run just finds no
    # new candle and sends a short summary -- harmless.
    - cron: "50 10 * * 1-5"
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: bot-state           # never run at the same time as the other workflows
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run end-of-day screener + tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_USER: ${{ secrets.CALLMEBOT_USER }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          CAPITAL: ${{ vars.CAPITAL }}
        run: python3 main.py

      - name: Save results back to the repo
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
          git config user.name "nse-swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals.csv last_run.txt
          git diff --cached --quiet || git commit -m "EOD update [bot]"
          git pull --rebase --autostash && git push
