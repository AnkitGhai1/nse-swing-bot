name: Intraday watch (every 15 min)

on:
  schedule:
    # Every 15 min from 04:07 to 09:52 UTC = 9:37am to 3:22pm IST, Mon-Fri.
    # Odd minutes on purpose: GitHub's scheduler is busiest at :00 and delays
    # those runs most. Runs can still start a few minutes late -- that's
    # GitHub's limitation, not the script's.
    - cron: "7,22,37,52 4-9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Exit watch + breakout scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_USER: ${{ secrets.CALLMEBOT_USER }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          CAPITAL: ${{ vars.CAPITAL }}
          INTRADAY_ENABLED: ${{ vars.INTRADAY_ENABLED }}
        run: python3 intraday.py

      - name: Save results back to the repo
        run: |
          git config user.name "nse-swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals.csv
          git diff --cached --quiet || git commit -m "Intraday update [bot]"
          git pull --rebase --autostash && git push
